# Keeps the workflow actions and the dev toolchain (uv.lock) current. The
# pre-commit hook revisions have no dependabot ecosystem; the
# pre-commit-autoupdate workflow covers those.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
