# Monthly bump of the pre-commit hook revisions, opened as a PR. Dependabot
# has no ecosystem for these; every hook in the config was 18 months stale
# before this existed. The ruff hook must stay in step with the ruff in
# uv.lock, so review that line before merging.
name: pre-commit autoupdate

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pre-commit autoupdate
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/pre-commit-autoupdate
          title: "chore(tooling): pre-commit autoupdate"
          commit-message: "chore(tooling): pre-commit autoupdate"
          body: |
            Monthly bump of the pre-commit hook revisions.

            Check that the `astral-sh/ruff-pre-commit` rev matches the ruff in
            `uv.lock` (`uv lock --upgrade-package ruff` if not), then merge.
