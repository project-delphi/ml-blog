# Installed into .git/hooks by `.venv/bin/pre-commit install`, so it runs on
# the files staged for a commit and nothing else. Never `pre-commit run
# --all-files`: the formatters fix in place, and that rewrites files far from
# your change. The paths below are excluded outright -- rendered output, frozen
# records, the vendored extension, cached upstream data, and the lockfile --
# because reformatting any of them corrupts something that is not prose.
exclude: ^(docs/|_freeze/|_extensions/|posts/[^/]+/(data|widget-data)/|uv\.lock$)
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      # 500 kB cap. Render-time data caches are excluded at the top of this
      # file rather than by raising the limit.
      - id: check-added-large-files
      - id: detect-private-key
      - id: no-commit-to-branch
      - id: mixed-line-ending
  # One tool for lint, import order, and formatting. Keep this rev in step with
  # the ruff in uv.lock, or the hook and `make lint` disagree.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Prose spelling for .qmd and .md. Configured in [tool.codespell].
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies: [tomli]
  # The two Claude Code policy hooks are the most regex-dense code in the repo.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1-1
    hooks:
      - id: shellcheck
        files: ^\.claude/hooks/.*\.sh$
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: '0.26'
    hooks:
      - id: validate-pyproject
  # Conventional commit messages (`feat(posts): ...`). Installed separately:
  # `.venv/bin/pre-commit install --hook-type commit-msg`.
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      - id: commitizen
        stages: [commit-msg]
