exclude: "^$"
fail_fast: false
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # The two posts' data/ directories hold byte-for-byte caches of upstream
      # files (src/fetch_data.py writes the raw response). Reformatting them
      # would make the committed copy differ from a fresh fetch, so leave them.
      - id: trailing-whitespace
        exclude: ^posts/[^/]+/data/
      - id: end-of-file-fixer
        exclude: ^posts/[^/]+/data/
      - id: check-yaml
      # Two posts read a committed data file at render time (volcano-plots'
      # DESeq2 table, 2.4 MB; the signature post's Golub matrices, 2.3 MB
      # gzipped). Those are source, not scratch -- see .gitignore. The 500 kB
      # default would reject them, so raise it rather than leave a rule the
      # repo's own tracked files already violate.
      - id: check-added-large-files
        args: ["--maxkb=4000"]
      - id: check-ast
      - id: check-toml
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: check-json
      - id: no-commit-to-branch
      - id: mixed-line-ending
      - id: debug-statements
      - id: name-tests-test
      - id: requirements-txt-fixer
        filenames: "./requirements/requirements_dev.txt ./requirements/requirements_test.txt ./requirements/requirements_run.txt"
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.15.1
    hooks:
      - id: pyupgrade
        args: [--py38-plus]
  - repo: https://github.com/psf/black
    rev: 24.2.0
    hooks:
      - id: black
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.18.4
    hooks:
      - id: commitizen
        stages: [commit-msg]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.16
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        args: ["--config-file", "pyproject.toml"]
        additional_dependencies:
          - pytest
          - tomli
          - types-chardet
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.3.2
    hooks:
      - id: ruff
        types_or: [python, pyi, jupyter]
        args: ["--fix"]
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.1-beta
    hooks:
      - id: hadolint
