project:
  type: website
  output-dir: docs
  render:
  - "*.qmd"
  - "*.ipynb"
  # The widget runtime is a plain resource copied on every render, so a kit
  # fix never needs a post to re-execute. Every post loads it through
  # posts/_metadata.yml.
  resources:
  - widget-kit/kit.js
  # The three.js stage for 3D widgets; loaded only by the posts that use it.
  - widget-kit/stage.js
website:
  title: "Synthetic Musings"
  description: "Technical write-ups on machine learning, statistics, linear algebra, and the tooling around them, by Ravi Kalia."
  # site-url makes every link in the feed, the sitemap, and the social cards
  # absolute. GitHub Pages serves the site from this sub-path.
  site-url: https://project-delphi.github.io/ml-blog/
  # Quarto's default draft-mode is `gone`, which renders a `draft: true` post as an
  # empty page -- so a draft cannot be previewed by the reviewer it is waiting on.
  # `unlinked` renders the page in full while keeping it out of the home listing,
  # the navbar, and search.
  draft-mode: unlinked
  repo-url: https://github.com/project-delphi/ml-blog/
  repo-actions: [edit]
  repo-branch: main
  favicon: favicon.png
  # Social preview cards read each post's `image:` and `description:`.
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  search:
    location: navbar
    type: overlay
  navbar:
    left:
      - text: Posts
        href: index.qmd
      - text: About
        href: about.qmd
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS feed
      - icon: github
        href: https://github.com/project-delphi
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/ravi-kalia-phd
        aria-label: LinkedIn
      - icon: house-fill
        href: https://project-delphi.github.io
        aria-label: Home
  page-footer:
    left: "Synthetic Musings, by Ravi Kalia"
    right: "Built with [Quarto](https://quarto.org/)"
format:
  html:
    # A light/dark pair puts a toggle in the navbar. Both halves define the
    # same `--w-*` tokens (theme/*.scss); the widget chrome partial and the
    # per-post stylesheets read those and never name a colour twice.
    theme:
      light: [zephyr, theme/light.scss, widget-kit/chrome.scss]
      dark: [zephyr, theme/dark.scss, widget-kit/chrome.scss]
    # Spacing and size for display maths, outside the Sass theme so that editing
    # it never touches docs/site_libs/. A list, so a post's own `css: post.css`
    # is appended to it rather than replacing it.
    css: [theme/math.css]
    # MathJax 4, pinned. Its New Computer Modern font is heavier than MathJax 3's
    # and sits better beside the sans body face. Quarto 1.6 numbers equations
    # with \tag{} and writes no MathJax configuration of its own, so the version
    # change needs nothing else.
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-chtml.js"
    # Its configuration: the font pinned to the same release, and a display wider
    # than the column scaled to fit (theme/mathjax.html says why not line breaks). A list, so the
    # widget kit include in posts/_metadata.yml is appended rather than replaced.
    include-in-header:
      - file: theme/mathjax.html
    code-copy: true
    link-external-newwindow: true
    smooth-scroll: true
    footnotes-hover: true
    crossrefs-hover: true
