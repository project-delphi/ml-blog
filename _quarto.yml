project:
  type: website
  output-dir: docs
  # Copied into docs/ on every render. GitHub Pages serves this repo with the
  # legacy Jekyll builder, which walks all ~80 rendered posts on each deploy;
  # .nojekyll skips Jekyll entirely and publishes the directory as-is. Listing
  # it here (rather than committing docs/.nojekyll on its own) is what keeps it
  # alive -- a project render deletes and rebuilds docs/, so an unlisted file
  # would be silently wiped and the fix would regress on the next full render.
  resources:
    - .nojekyll
  render:
  - "*.qmd"
  - "*.ipynb"
  - "!notes/"
website:
  repo-url: https://github.com/project-delphi/ml-blog/
  repo-actions: [edit]
  repo-branch: main
  title: "Blog Directory"
  favicon: favicon.png
  navbar:
    right:
      - icon: github
        href: https://github.com/project-delphi
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/ravi-kalia-phd
        aria-label: LinkedIn
      - icon: house-fill
        href: https://project-delphi.github.io
        aria-label: LinkedIn
format:
  html:
    theme: zephyr
    css: styles.css
    code-copy: true
    monobackgroundcolor: "#eef0f4"
