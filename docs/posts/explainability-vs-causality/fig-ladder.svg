<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 300" width="776" height="300"
     role="img"
     aria-label="Pearl's ladder of causation as three rungs. Rung one, association, is seeing: what does observing X tell me about Y. Rung two, intervention, is doing: what happens to Y if I set X. Rung three, counterfactuals, is imagining: would Y have happened had X been different. Feature attribution sits on rung one; a bracket marks that everything above it requires a causal model.">
  <rect x="0" y="0" width="776" height="300" fill="#ffffff"/>

  <style>
    .rung { font: bold 15px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .verb { font: italic 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4A3AA7; }
    .q    { font: 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
    .num  { font: bold 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
    .side { font: 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
    .sideb{ font: bold 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #b87a33; }
  </style>

  <!-- ladder rails -->
  <line x1="60" y1="252" x2="112" y2="44" stroke="#c3c8d3" stroke-width="4" stroke-linecap="round"/>
  <line x1="560" y1="252" x2="612" y2="44" stroke="#c3c8d3" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== rung 1: association ===== -->
  <line x1="66" y1="230" x2="566" y2="230" stroke="#6b7280" stroke-width="3"/>
  <circle cx="96" cy="212" r="14" fill="#9aa1ae"/>
  <text class="num" x="96" y="217" text-anchor="middle">1</text>
  <text class="rung" x="122" y="208">Association <tspan class="verb">&#8212; seeing</tspan></text>
  <text class="q"    x="122" y="226">What does observing X tell me about Y?</text>

  <!-- ===== rung 2: intervention ===== -->
  <line x1="97" y1="152" x2="597" y2="152" stroke="#6b7280" stroke-width="3"/>
  <circle cx="127" cy="134" r="14" fill="#6A5CBB"/>
  <text class="num" x="127" y="139" text-anchor="middle">2</text>
  <text class="rung" x="153" y="130">Intervention <tspan class="verb">&#8212; doing</tspan></text>
  <text class="q"    x="153" y="148">What happens to Y if I set X?</text>

  <!-- ===== rung 3: counterfactuals ===== -->
  <line x1="128" y1="74" x2="628" y2="74" stroke="#6b7280" stroke-width="3"/>
  <circle cx="158" cy="56" r="14" fill="#4A3AA7"/>
  <text class="num" x="158" y="61" text-anchor="middle">3</text>
  <text class="rung" x="184" y="52">Counterfactuals <tspan class="verb">&#8212; imagining</tspan></text>
  <text class="q"    x="184" y="70">Would Y have happened had X been different?</text>

  <!-- attribution sits on rung 1 -->
  <text class="sideb" x="122" y="264">SHAP, LIME, saliency, attention live here</text>

  <!-- bracket: rungs 2 and 3 only; rung 1 is exactly what needs no causal model -->
  <path d="M648 176 q12 0 12 -12 l0 -42 q0 -12 12 -12 q-12 0 -12 -12 l0 -42 q0 -12 -12 -12"
        fill="none" stroke="#c3c8d3" stroke-width="2"/>
  <text class="side" x="682" y="94">needs a</text>
  <text class="side" x="682" y="112">causal</text>
  <text class="side" x="682" y="130">model</text>
</svg>
