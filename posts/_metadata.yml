# options specified here will apply to all posts in this folder

# freeze computational output
# (see https://quarto.org/docs/projects/code-execution.html#freeze)
freeze: auto

# Enable banner style title blocks
title-block-banner: true

# Reading aids every post gets unless its own frontmatter says otherwise.
# A third of the posts had no table of contents at all before this existed.
toc: true
toc-depth: 3

# The shared widget runtime (widget-kit/kit.js, see widget-kit/README.md).
# Every post sits at posts/<slug>/, so the relative path is the same for all
# of them and works from file://, a static server, and GitHub Pages.
include-in-header:
  - text: '<script src="../../widget-kit/kit.js"></script>'
