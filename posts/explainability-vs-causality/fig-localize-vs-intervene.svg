<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320"
     role="img"
     aria-label="Two operations side by side. Localizing shines a spotlight inside a sealed model to find which component carried a fixed input to a fixed output; the model and the world are both left untouched. Intervening turns a dial in the world itself, producing a before state and an after state whose difference is the effect.">
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>

  <style>
    .ttl  { font: bold 15px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .lbl  { font: 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
    .sm   { font: 11px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6b7280; }
    .node { font: bold 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arwp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4A3AA7"/>
    </marker>
  </defs>

  <!-- ================= LEFT: LOCALIZE ================= -->
  <text class="ttl" x="34" y="32">Localize</text>
  <text class="sm"  x="34" y="52">read the association off a model that is already fixed</text>

  <!-- sealed box -->
  <rect x="34" y="70" width="286" height="150" rx="8" fill="#f4f5f8" stroke="#4b5563" stroke-width="2"/>
  <text class="sm" x="44" y="90">fitted model &#8212; not retrained, not altered</text>

  <!-- internal components; middle one is the located part -->
  <rect x="56"  y="118" width="58" height="42" rx="5" fill="#c3c8d3"/>
  <rect x="140" y="118" width="58" height="42" rx="5" fill="#4A3AA7"/>
  <rect x="224" y="118" width="58" height="42" rx="5" fill="#c3c8d3"/>
  <line x1="114" y1="139" x2="138" y2="139" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="198" y1="139" x2="222" y2="139" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- spotlight cone onto the located part -->
  <path d="M169 60 L206 116 L132 116 Z" fill="#4A3AA7" opacity="0.14"/>
  <circle cx="169" cy="56" r="7" fill="none" stroke="#4A3AA7" stroke-width="2.4"/>
  <line x1="174" y1="61" x2="182" y2="69" stroke="#4A3AA7" stroke-width="2.4" stroke-linecap="round"/>

  <text class="sm" x="169" y="176" text-anchor="middle" fill="#4A3AA7">this part</text>

  <!-- fixed input / fixed output, below the sealed box -->
  <text class="lbl" x="34" y="240">input (fixed)</text>
  <text class="lbl" x="320" y="240" text-anchor="end">output (fixed)</text>

  <!-- world untouched -->
  <rect x="34" y="254" width="286" height="48" rx="8" fill="#ffffff" stroke="#d3d7de" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="sm" x="177" y="274" text-anchor="middle">the world</text>
  <text class="sm" x="177" y="291" text-anchor="middle" fill="#9aa1ae">never touched</text>

  <!-- divider -->
  <line x1="360" y1="24" x2="360" y2="296" stroke="#d3d7de" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- ================= RIGHT: INTERVENE ================= -->
  <text class="ttl" x="400" y="32">Intervene</text>
  <text class="sm"  x="400" y="52">set a variable in the world and read what follows</text>

  <!-- the hand on the dial -->
  <circle cx="470" cy="122" r="34" fill="#f4f5f8" stroke="#4A3AA7" stroke-width="2.4"/>
  <line x1="470" y1="122" x2="470" y2="96" stroke="#4A3AA7" stroke-width="3.4" stroke-linecap="round"/>
  <path d="M496 108 A34 34 0 0 1 496 138" fill="none" stroke="#b87a33" stroke-width="2.6" marker-end="url(#arw)"/>
  <!-- flat hand glyph -->
  <path d="M508 150 l0 -22 q0 -6 6 -6 q6 0 6 6 l0 -12 q0 -6 6 -6 q6 0 6 6 l0 10 q0 -6 6 -6 q6 0 6 6 l0 24 q0 18 -18 18 l-12 0 q-12 0 -12 -18 z"
        fill="#e6e3f4" stroke="#4A3AA7" stroke-width="1.8" stroke-linejoin="round"/>
  <text class="sm" x="470" y="176" text-anchor="middle" fill="#4A3AA7">do(X = x)</text>

  <!-- before / after split -->
  <line x1="400" y1="200" x2="686" y2="200" stroke="#d3d7de" stroke-width="1.5"/>

  <text class="lbl" x="400" y="224">before</text>
  <rect x="400" y="234" width="126" height="54" rx="6" fill="#eef0f4" stroke="#6b7280" stroke-width="1.6"/>
  <rect x="414" y="262" width="22" height="16" fill="#9aa1ae"/>
  <rect x="444" y="252" width="22" height="26" fill="#9aa1ae"/>
  <rect x="474" y="268" width="22" height="10" fill="#9aa1ae"/>

  <text class="lbl" x="560" y="224">after</text>
  <rect x="560" y="234" width="126" height="54" rx="6" fill="#eef0f4" stroke="#4A3AA7" stroke-width="1.6"/>
  <rect x="574" y="246" width="22" height="32" fill="#4A3AA7"/>
  <rect x="604" y="256" width="22" height="22" fill="#4A3AA7"/>
  <rect x="634" y="266" width="22" height="12" fill="#4A3AA7"/>

  <line x1="530" y1="261" x2="556" y2="261" stroke="#4A3AA7" stroke-width="1.8" marker-end="url(#arwp)"/>
  <text class="sm" x="543" y="252" text-anchor="middle" fill="#4A3AA7">&#916;</text>
  <text class="sm" x="543" y="300" text-anchor="middle">the difference is the effect</text>
</svg>
