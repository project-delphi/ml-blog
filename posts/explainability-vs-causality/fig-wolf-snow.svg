<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"
     role="img"
     aria-label="The same photograph read two ways. On the left, the classifier keys on the snow filling the background, and its label is right for the wrong reason. On the right, what actually makes the animal a wolf is its skull, jaw and build, which the classifier never used.">
  <rect x="0" y="0" width="720" height="300" fill="#ffffff"/>

  <style>
    .ttl { font: bold 15px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2937; }
    .lbl { font: 13px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4b5563; }
    .tag { font: bold 12px system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #ffffff; }
  </style>

  <!-- LEFT: what the model keyed on -->
  <text class="ttl" x="40" y="34">What the model keyed on</text>
  <rect x="40" y="48" width="280" height="176" rx="6" fill="#eef0f4" stroke="#6b7280" stroke-width="1.5"/>

  <!-- snow: the region carrying the decision, hatched to read as "this is the evidence" -->
  <defs>
    <pattern id="snowfill" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#e3e7f5"/>
      <line x1="0" y1="0" x2="0" y2="10" stroke="#b87a33" stroke-width="2.4"/>
    </pattern>
  </defs>
  <rect x="41" y="150" width="278" height="73" fill="url(#snowfill)"/>
  <rect x="41" y="150" width="278" height="73" fill="none" stroke="#b87a33" stroke-width="2.5"/>

  <!-- the animal, drawn flat and greyed: present, but not used -->
  <g fill="#c9ced9" stroke="#9aa1ae" stroke-width="1.5">
    <path d="M148 150 l0 -34 l14 -16 l10 14 l22 0 l10 -14 l14 16 l0 34 z"/>
    <path d="M148 150 q36 -12 72 0 l0 0 z"/>
  </g>
  <circle cx="166" cy="112" r="2.6" fill="#6b7280" stroke="none"/>
  <circle cx="202" cy="112" r="2.6" fill="#6b7280" stroke="none"/>

  <rect x="41" y="186" width="152" height="22" rx="11" fill="#b87a33"/>
  <text class="tag" x="117" y="201" text-anchor="middle">SNOW: where credit fell</text>

  <text class="lbl" x="40" y="248">Predicts &#8220;wolf&#8221;. Correct label,</text>
  <text class="lbl" x="40" y="268">read off the background.</text>

  <!-- divider -->
  <line x1="360" y1="40" x2="360" y2="272" stroke="#d3d7de" stroke-width="1.5" stroke-dasharray="5 5"/>

  <!-- RIGHT: what makes it a wolf -->
  <text class="ttl" x="400" y="34">What makes it a wolf</text>
  <rect x="400" y="48" width="280" height="176" rx="6" fill="#eef0f4" stroke="#6b7280" stroke-width="1.5"/>

  <!-- snow present but inert here -->
  <rect x="401" y="150" width="278" height="73" fill="#e3e7f5"/>

  <!-- the animal, now the carrier of wolf-ness -->
  <g fill="#c7c2e6" stroke="#4A3AA7" stroke-width="2.5">
    <path d="M508 150 l0 -34 l14 -16 l10 14 l22 0 l10 -14 l14 16 l0 34 z"/>
    <path d="M508 150 q36 -12 72 0 l0 0 z"/>
  </g>
  <circle cx="526" cy="112" r="2.8" fill="#4A3AA7" stroke="none"/>
  <circle cx="562" cy="112" r="2.8" fill="#4A3AA7" stroke="none"/>

  <line x1="544" y1="92" x2="612" y2="72" stroke="#4A3AA7" stroke-width="1.5"/>
  <text class="lbl" x="616" y="76">skull</text>
  <line x1="544" y1="140" x2="612" y2="128" stroke="#4A3AA7" stroke-width="1.5"/>
  <text class="lbl" x="616" y="132">jaw</text>
  <line x1="568" y1="146" x2="612" y2="176" stroke="#4A3AA7" stroke-width="1.5"/>
  <text class="lbl" x="616" y="180">build</text>

  <text class="lbl" x="400" y="248">Structure the classifier never</text>
  <text class="lbl" x="400" y="268">used, and snow cannot supply.</text>
</svg>
