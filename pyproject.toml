[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "ml_blog"
version = "0.1.0"
description = "ml_blog"
readme = "README.md"
requires-python = ">=3.11"

# The base toolchain: what `make kernels-stub` and a freeze-only render need.
# Everything else is a dev tool and lives in the `dev` group below, which
# `uv sync` installs by default. Per-post ML dependencies never go here --
# each executing post has its own .venv-<slug> and requirements.txt.
dependencies = [
  "ipykernel",
  "jupyter",
]

[dependency-groups]
dev = [
  "codespell",
  "commitizen",
  "ipython",
  "mypy",
  "pre-commit",
  "pydoclint",
  "pytest",
  "ruff",
]

# This project ships no importable code -- it exists to declare the base
# dev/lint toolchain. Without these, setuptools' flat-layout auto-discovery
# treats `posts/` as a package, so installing put the blog's post directories
# on sys.path and made `import posts` resolve to them. Empty lists disable
# discovery outright; there is nothing here to package.
[tool.setuptools]
packages = []
py-modules = []

# ruff does linting, import sorting, and formatting (it replaced black, isort,
# and pyupgrade). Rendered output and frozen records are never linted: docs/
# is machine-written, _freeze/ is data, and the .ipynb posts carry stored
# outputs that a formatter would rewrite.
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["docs", "_freeze", "_extensions", ".venv*", "*.ipynb"]

[tool.ruff.lint]
select = ["D", "E", "F", "I", "UP"]
ignore = [
  "E501", # line length: the formatter owns it
  "D100", # public module
  "D101", # public class
  "D102", # public method
  "D103", # public function
  "D105", # magic methods
  "D107", # init
  "D202", # blank lines after function docstring
  "D205", # blank line between summary line and description
  "D417", # missing argument descriptions
  "UP042", # str-Enum -> StrEnum changes str() of post code that is published as-is
]

[tool.ruff.lint.per-file-ignores]
"*test*.py" = ["D"] # ignore all docstring lints in tests

# Docstrings here are Google style, matching [tool.pydoclint] below. The
# earlier `numpy` setting produced 250 spurious D406/D407 errors and nothing
# else -- the "lint debt" was this one line.
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

[tool.pydoclint]
style = 'google'
require-return-section-when-returning-none = true

[tool.mypy]
ignore_missing_imports = true
exclude = ["^docs/", "^_freeze/", "^\\.venv"]

# Prose spelling. Machine-written and data files are skipped, and the
# domain words codespell mistakes for typos (LSAT, ROUGE, MAPE...) live in
# .codespell-ignore, one per line. Run it with `make spell`.
[tool.codespell]
skip = "./.git,./docs,./_freeze,./_extensions,./.venv*,./uv.lock,*.ipynb,*.json,*.csv,*.tsv,*.svg,*.txt,*.js,*.png"
ignore-words = ".codespell-ignore"
ignore-words-list = "pd,np,jax,nd,unparseable"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
