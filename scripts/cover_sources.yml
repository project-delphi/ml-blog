# Cover sources for scripts/make_cover.py
#
# Each slug is one of:
#   skip: true       — the post writes cover.png itself; do not overwrite
#   source: <path>   — in-post raster, relative to the repo root
#   commons: <file>  — Wikimedia Commons File: title (web-search fallback)
#
# Pick the figure that carries the post's main claim, not the first file
# in the folder. Examples: the Ripley press photo; the GSE52778 volcano.

