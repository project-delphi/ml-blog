<script>
// MathJax 4 configuration for every page (included from _quarto.yml, which also pins
// the MathJax version). Quarto 1.6 writes no MathJax configuration of its own.
//
// - The font is a separate package. Pin it to the same release, or MathJax 4.0.0
//   fetches the unversioned latest font and warns.
// - A display wider than the column (a phone, mostly) is scaled down to fit, so an
//   aligned derivation keeps its alignment and its equation number.
//
// Not "linebreak", which looks like the better choice for long one-line displays:
// in MathJax 4.0.0 (and 4.1.3), once one display on a page has been broken, every
// aligned/cases/matrix table typeset after it lays out with its columns overlapping
// (k_p(x,x') printed on top of the next cell). The posts lean on aligned blocks, so
// one broken display would garble the rest of the page on a phone.
//
// Size is set on Quarto's span.math wrappers (theme/math.css), never with an
// !important font-size on mjx-container: MathJax scales a display through that
// element's inline font-size, and an !important rule silently cancels it. With
// matchFontHeight off, MathJax does not rescale the maths to the body face's tall
// x-height either, so those percentages are the sizes the reader sees.
window.MathJax = {
  loader: {
    paths: { "mathjax-newcm": "https://cdn.jsdelivr.net/npm/@mathjax/mathjax-newcm-font@4.0.0" },
  },
  output: { displayOverflow: "scale", matchFontHeight: false },
};
</script>
